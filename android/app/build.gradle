import java.io.FileInputStream

plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
def hasReleaseSigning = keystorePropertiesFile.exists()
// Fall back to Google's official test App ID so the app does not crash
// when AdMob has not been configured yet. Replace by setting the
// CALGO_ADMOB_APP_ID environment variable before building.
def admobAppId = System.getenv("CALGO_ADMOB_APP_ID") ?: "ca-app-pub-3940256099942544~3347511713"
if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.calgo.calgo"
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.calgo.calgo"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        // Google Play requires API 36 for updates starting 31 Aug 2026.
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled = true
        manifestPlaceholders["admobAppId"] = admobAppId
        // Play production artifacts only need the required 64-bit ARM ABI.
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    flavorDimensions += "environment"
    productFlavors {
        // AGP reserves flavor names starting with "test" for test variants.
        // The user-facing build command remains `testing` via the helper
        // script, while the Gradle-safe flavor is named `calgoTesting`.
        calgoTesting {
            dimension "environment"
            versionNameSuffix "-testing"
        }
        production {
            dimension "environment"
        }
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // Keep debug builds usable on developer machines. The
            // preReleaseBuild guard below prevents any release artifact from
            // being produced until a real upload key is configured.
            signingConfig = hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }

}

tasks.matching { task -> task.name == "preReleaseBuild" }.configureEach {
    doFirst {
        if (!hasReleaseSigning) {
            throw new GradleException(
                "Missing android/key.properties. Configure a release upload key before building a release bundle."
            )
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}

flutter {
    source = "../.."
}

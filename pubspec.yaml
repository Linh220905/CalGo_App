name: calgo
description: "CAL.ai - Food recognition & calorie estimation app"
publish_to: 'none'
version: 1.0.6+38

environment:
  # The build environment currently provides Dart 3.9.0.
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.3
  go_router: ^14.0.0
  http: ^1.2.0
  provider: ^6.1.0
  google_sign_in: ^6.2.0
  sign_in_with_apple: ^6.1.2
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^10.3.1
  image_picker: ^1.1.0
  camera: ^0.11.0+1
  permission_handler: ^11.3.1
  flutter_svg: ^2.0.10+1
  flutter_animate: ^4.5.0
  fl_chart: ^0.69.2
  font_awesome_flutter: ^11.0.0
  url_launcher: ^6.3.1
  # Keep the billing plugins compatible with the current Dart 3.9 build image.
  # Upgrade these together with the build image when moving to Dart 3.12+.
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.3
  in_app_purchase_storekit: ^0.4.11+2
  purchases_flutter: ^8.6.0
  google_mobile_ads: ^5.1.0
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  intl: ">=0.19.0 <0.21.0"
  mobile_scanner: ^6.0.0
  health: ^13.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

dependency_overrides:
  # health 13.3.2 asks for device_info_plus 13.x (win32 6.x), but the current
  # Codemagic image uses Dart 3.9 and share_plus 10.x uses win32 5.x. Health
  # only uses the stable id/identifierForVendor fields from this package.
  device_info_plus: 12.4.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/tao/
    - assets/images/badges/
    - assets/images/apple_mascot/
    - assets/images/calgo_logo_wordmark.png
    - assets/images/CalGo.png
    - assets/images/background.png

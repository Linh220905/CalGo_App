<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="wheatGrad" x1="20" y1="4" x2="28" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Main curved stem -->
  <path d="M24 46C23.5 40 22 34 23 28C24 22 27 16 28 12" stroke="url(#wheatGrad)" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Whiskers at top (râu lúa) -->
  <path d="M28 12C29 8 28.5 5 27 2" stroke="#FCD34D" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <path d="M28 12C31 9 32 5.5 31 3" stroke="#FCD34D" stroke-width="1.2" stroke-linecap="round" fill="none"/>

  <!-- Left grains (hạt bên trái) -->
  <ellipse cx="22.5" cy="14" rx="2.2" ry="4.2" transform="rotate(-30 22.5 14)" fill="#FBBF24"/>
  <ellipse cx="20.5" cy="20" rx="2.4" ry="4.5" transform="rotate(-20 20.5 20)" fill="#F59E0B"/>
  <ellipse cx="20" cy="27" rx="2.2" ry="4" transform="rotate(-10 20 27)" fill="#D97706"/>

  <!-- Right grains (hạt bên phải) -->
  <ellipse cx="31" cy="12" rx="2.2" ry="4.2" transform="rotate(25 31 12)" fill="#FBBF24"/>
  <ellipse cx="30.5" cy="18.5" rx="2.4" ry="4.5" transform="rotate(18 30.5 18.5)" fill="#F59E0B"/>
  <ellipse cx="28" cy="25" rx="2.2" ry="4" transform="rotate(8 28 25)" fill="#D97706"/>

  <!-- Top grain (hạt đỉnh) -->
  <ellipse cx="27.5" cy="7.5" rx="2" ry="3.8" transform="rotate(10 27.5 7.5)" fill="#FCD34D"/>

  <!-- Tiny leaf at base -->

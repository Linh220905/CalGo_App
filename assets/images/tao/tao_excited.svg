<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <ellipse cx="100" cy="225" rx="50" ry="10" fill="rgba(0,0,0,0.08)"/>
  <defs>
    <linearGradient id="appleGrad" x1="50" y1="0" x2="150" y2="200">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="50%" stop-color="#EE4444"/>
      <stop offset="100%" stop-color="#CC2222"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
  </defs>
  <ellipse cx="105" cy="46" rx="14" ry="18" fill="url(#leafGrad)" transform="rotate(20 105 46)"/>
  <line x1="105" y1="40" x2="105" y2="58" stroke="#16A34A" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M100 50 L100 36" stroke="#78350F" stroke-width="3" stroke-linecap="round"/>
  <path d="M100 190 C145 190 170 168 170 130 C170 95 155 80 140 70 C130 62 118 58 100 56 C82 58 70 62 60 70 C45 80 30 95 30 130 C30 168 55 190 100 190Z" fill="url(#appleGrad)"/>
  <path d="M55 110 C50 125 50 145 60 160" stroke="rgba(255,255,255,0.25)" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Eyebrows: raised high with excitement -->
  <path d="M66 90 C74 84 82 84 90 88" stroke="#1E293B" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M134 90 C126 84 116 84 110 88" stroke="#1E293B" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Eyes: wide with big pupils -->
  <ellipse cx="78" cy="110" rx="8" ry="10" fill="#1E293B"/>
  <ellipse cx="122" cy="110" rx="8" ry="10" fill="#1E293B"/>
  <circle cx="78" cy="108" r="4" fill="white" opacity="0.9"/>
  <circle cx="122" cy="108" r="4" fill="white" opacity="0.9"/>
  <!-- Mouth: big open happy smile with tongue -->
  <path d="M78 132 C88 158 112 158 122 132" stroke="#1E293B" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M83 135 C90 153 110 153 117 135Z" fill="#CC2222"/>
  <ellipse cx="100" cy="150" rx="9" ry="5" fill="#FFB3B3"/>
  <!-- Blush: rosy -->
  <ellipse cx="60" cy="126" rx="10" ry="6" fill="#FFB3B3" opacity="0.5"/>
  <ellipse cx="140" cy="126" rx="10" ry="6" fill="#FFB3B3" opacity="0.5"/>
  <!-- Arms: raised up in celebration -->
  <path d="M38 110 C18 88 18 62 25 48" stroke="#CC2222" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="25" cy="48" r="5" fill="#FF6B6B"/>
  <path d="M162 110 C182 88 182 62 175 48" stroke="#CC2222" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="175" cy="48" r="5" fill="#FF6B6B"/>
  <!-- Star sparkles -->
  <path d="M52 35 L55 43 L63 43 L57 48 L59 56 L52 51 L45 56 L47 48 L41 43 L49 43Z" fill="#FBBF24" opacity="0.85"/>
  <path d="M148 35 L150 41 L156 41 L151 45 L153 51 L148 47 L143 51 L145 45 L140 41 L146 41Z" fill="#FBBF24" opacity="0.85"/>
  <!-- Feet -->
  <rect x="70" y="190" width="16" height="20" rx="8" fill="#CC2222"/>
  <rect x="114" y="190" width="16" height="20" rx="8" fill="#CC2222"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="320" height="360" viewBox="0 0 320 360" fill="none">
  <defs>
    <!-- Body gradient — softer, warmer -->
    <radialGradient id="bodyGrad" cx="38%" cy="22%" r="85%">
      <stop offset="0%" stop-color="#FFB5B5" />
      <stop offset="40%" stop-color="#FF5A5A" />
      <stop offset="100%" stop-color="#D32F2F" />
    </radialGradient>

    <!-- Leaf gradient -->
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#81C784" />
      <stop offset="100%" stop-color="#388E3C" />
    </linearGradient>

    <!-- Stem gradient -->
    <linearGradient id="stemGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8D6E63" />
      <stop offset="100%" stop-color="#5D3A1A" />
    </linearGradient>

    <!-- Shadow — softer dispersion -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#B71C1C" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- ===================== WHOLE MASCOT ===================== -->
  <g>
    <!-- Bobbing — spline easing for smooth float, not linear -->
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="3s" calcMode="spline" keySplines="0.33 0 0.66 1; 0.33 0 0.66 1" repeatCount="indefinite" />

    <!-- Ground shadow — squishes when body goes down -->
    <ellipse cx="160" cy="330" rx="58" ry="10" fill="#000" opacity="0.08">
      <animate attributeName="rx" values="58;52;58" dur="3s" calcMode="spline" keySplines="0.33 0 0.66 1; 0.33 0 0.66 1" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.08;0.13;0.08" dur="3s" calcMode="spline" keySplines="0.33 0 0.66 1; 0.33 0 0.66 1" repeatCount="indefinite" />
    </ellipse>

    <!-- ===================== STEM ===================== -->
    <path d="M160 68 C160 52 163 40 170 30" stroke="url(#stemGrad)" stroke-width="6" stroke-linecap="round" />

    <!-- ===================== LEAF ===================== -->
    <g transform-origin="170 34">
      <animateTransform attributeName="transform" type="rotate" values="-3 170 34; 6 170 34; -3 170 34" dur="3.5s" calcMode="spline" keySplines="0.33 0 0.66 1; 0.33 0 0.66 1" repeatCount="indefinite" />
      <path d="M170 32 C198 18 216 34 206 56 C188 60 172 50 170 32Z" fill="url(#leafGrad)" />
      <path d="M176 34 C180 40 182 46 183 52" stroke="#2E7D32" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- ===================== BODY ===================== -->
    <g filter="url(#shadow)">
      <path fill="url(#bodyGrad)" d="M160 80 C120 78 82 100 70 150 C56 200 70 258 115 290 C135 306 185 306 205 290 C250 258 264 200 250 150 C238 100 200 78 160 80Z" />
    </g>

    <!-- Top dimple -->
    <ellipse cx="160" cy="82" rx="14" ry="7" fill="#C62828" opacity="0.3" />

    <!-- Body highlight — left side, softer -->
    <ellipse cx="112" cy="165" rx="12" ry="46" fill="white" opacity="0.12" transform="rotate(12 112 165)" />

    <!-- Small highlight -->
    <ellipse cx="126" cy="130" rx="8" ry="16" fill="white" opacity="0.18" />

    <!-- ===================== FACE ===================== -->

    <!-- Left eye -->
    <g transform-origin="130 172">
      <ellipse cx="130" cy="172" rx="14" ry="18" fill="#1E293B" />
      <circle cx="125" cy="166" r="4.5" fill="white" />
      <!-- Blink: smooth scale instead of instant -->
      <animateTransform attributeName="transform" type="scale" values="1 1; 1 1; 1 .08; 1 1; 1 1" keyTimes="0; 0.46; 0.5; 0.54; 1" dur="4.5s" calcMode="spline" keySplines="0 0 1 1; 0.33 0 0.66 1; 0.33 0 0.66 1; 0 0 1 1" repeatCount="indefinite" />
    </g>

    <!-- Right eye — slight offset for natural feel -->
    <g transform-origin="190 172">
      <ellipse cx="190" cy="172" rx="14" ry="18" fill="#1E293B" />
      <circle cx="185" cy="166" r="4.5" fill="white" />
      <animateTransform attributeName="transform" type="scale" values="1 1; 1 1; 1 .08; 1 1; 1 1" keyTimes="0; 0.46; 0.5; 0.54; 1" dur="4.5s" begin="0.04s" calcMode="spline" keySplines="0 0 1 1; 0.33 0 0.66 1; 0.33 0 0.66 1; 0 0 1 1" repeatCount="indefinite" />
    </g>

    <!-- Blush — soft pink, pulsing -->
    <ellipse cx="108" cy="198" rx="16" ry="10" fill="#FFB0C0" opacity="0.4">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="2.5s" calcMode="spline" keySplines="0.33 0 0.66 1; 0.33 0 0.66 1" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="212" cy="198" rx="16" ry="10" fill="#FFB0C0" opacity="0.4">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="2.5s" begin="0.3s" calcMode="spline" keySplines="0.33 0 0.66 1; 0.33 0 0.66 1" repeatCount="indefinite" />
    </ellipse>

    <!-- Eyebrows — subtle arc -->
    <path d="M116 142 C124 138 136 138 144 142" stroke="#8E2424" stroke-width="3.5" stroke-linecap="round" />
    <path d="M176 142 C184 138 196 138 204 142" stroke="#8E2424" stroke-width="3.5" stroke-linecap="round" />

    <!-- Smile — wider, happier -->
    <path d="M136 212 C148 226 172 226 184 212" stroke="#5D1A1A" stroke-width="4.5" stroke-linecap="round" fill="none" />

    <!-- ===================== ARMS ===================== -->

    <!-- Left arm — waving -->
    <g transform-origin="80 180">
      <animateTransform attributeName="transform" type="rotate" values="-10 80 180; 6 80 180; -10 80 180" dur="2.5s" calcMode="spline" keySplines="0.33 0 0.66 1; 0.33 0 0.66 1" repeatCount="indefinite" />
      <path d="M82 176 C58 174 46 188 50 210 C58 215 70 209 82 196" fill="url(#bodyGrad)" />
      <circle cx="50" cy="210" r="8" fill="#FF5A5A" />
    </g>

    <!-- Right arm — waving offset -->
    <g transform-origin="240 180">
      <animateTransform attributeName="transform" type="rotate" values="10 240 180; -6 240 180; 10 240 180" dur="2.5s" calcMode="spline" keySplines="0.33 0 0.66 1; 0.33 0 0.66 1" begin="0.15s" repeatCount="indefinite" />
      <path d="M238 176 C262 174 274 188 270 210 C262 215 250 209 238 196" fill="url(#bodyGrad)" />
      <circle cx="270" cy="210" r="8" fill="#FF5A5A" />
    </g>

    <!-- ===================== FEET ===================== -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -1.5; 0 0" dur="1.5s" calcMode="spline" keySplines="0.33 0 0.66 1; 0.33 0 0.66 1" repeatCount="indefinite" />
      <ellipse cx="134" cy="306" rx="15" ry="10" fill="#D93A3A" />
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -1.5; 0 0" dur="1.5s" begin="0.2s" calcMode="spline" keySplines="0.33 0 0.66 1; 0.33 0 0.66 1" repeatCount="indefinite" />
      <ellipse cx="186" cy="306" rx="15" ry="10" fill="#D93A3A" />
    </g>

    <!-- ===================== STARS ===================== -->
    <g opacity="0.85">
      <path d="M86 76 L89 84 L97 84 L91 89 L93 97 L86 92 L79 97 L81 89 L75 84 L83 84Z" fill="#FFD34D">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="2.5s" calcMode="spline" keySplines="0.33 0 0.66 1; 0.33 0 0.66 1" repeatCount="indefinite" />
      </path>
      <path d="M236 66 L238 72 L245 72 L240 76 L242 82 L236 78 L230 82 L232 76 L227 72 L234 72Z" fill="#FFD34D">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="3s" begin="0.5s" calcMode="spline" keySplines="0.33 0 0.66 1; 0.33 0 0.66 1" repeatCount="indefinite" />
      </path>
    </g>

    <!-- Sparkles -->
    <g opacity="0.8">
      <circle cx="96" cy="124" r="2" fill="#FFD54F">
        <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.2s" calcMode="spline" keySplines="0.33 0 0.66 1; 0.33 0 0.66 1" repeatCount="indefinite" />
      </circle>
      <circle cx="228" cy="148" r="2.5" fill="#FFD54F">
        <animate attributeName="opacity" values="0;1;0" dur="2.5s" begin="0.8s" calcMode="spline" keySplines="0.33 0 0.66 1; 0.33 0 0.66 1" repeatCount="indefinite" />
      </circle>
    </g>
  </g>
</svg>

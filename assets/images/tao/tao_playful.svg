<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <ellipse cx="100" cy="225" rx="50" ry="10" fill="rgba(0,0,0,0.08)"/>
  <defs>
    <linearGradient id="appleGrad" x1="50" y1="0" x2="150" y2="200">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="50%" stop-color="#EE4444"/>
      <stop offset="100%" stop-color="#CC2222"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
  </defs>
  <ellipse cx="105" cy="46" rx="14" ry="18" fill="url(#leafGrad)" transform="rotate(20 105 46)"/>
  <line x1="105" y1="40" x2="105" y2="58" stroke="#16A34A" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M100 50 L100 36" stroke="#78350F" stroke-width="3" stroke-linecap="round"/>
  <path d="M100 190 C145 190 170 168 170 130 C170 95 155 80 140 70 C130 62 118 58 100 56 C82 58 70 62 60 70 C45 80 30 95 30 130 C30 168 55 190 100 190Z" fill="url(#appleGrad)"/>
  <path d="M55 110 C50 125 50 145 60 160" stroke="rgba(255,255,255,0.25)" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Eyebrows: one raised (left) for mischievous look -->
  <path d="M66 92 C74 86 82 86 90 90" stroke="#1E293B" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M112 94 C118 90 126 90 132 96" stroke="#1E293B" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Eyes: left wink, right normal -->
  <path d="M72 110 C78 102 84 102 84 110" stroke="#1E293B" stroke-width="3" stroke-linecap="round" fill="none"/>
  <ellipse cx="122" cy="110" rx="6" ry="8" fill="#1E293B"/>
  <ellipse cx="124" cy="107" rx="2.5" ry="3" fill="white" opacity="0.8"/>
  <!-- Mouth: smirk (asymmetrical, one side up) -->
  <path d="M80 135 C90 140 100 138 120 130" stroke="#1E293B" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Tongue peeking out -->
  <ellipse cx="95" cy="140" rx="6" ry="4" fill="#FFB3B3"/>
  <!-- Blush -->
  <ellipse cx="62" cy="126" rx="10" ry="6" fill="#FFB3B3" opacity="0.5"/>
  <ellipse cx="138" cy="126" rx="10" ry="6" fill="#FFB3B3" opacity="0.5"/>
  <!-- Arms: left on hip, right relaxed -->
  <path d="M38 115 C18 120 15 140 30 148" stroke="#CC2222" stroke-width="7" stroke-linecap="round" fill="none"/>
  <circle cx="30" cy="148" r="5" fill="#FF6B6B"/>
  <path d="M162 115 C178 118 182 135 175 148" stroke="#CC2222" stroke-width="7" stroke-linecap="round" fill="none"/>
  <circle cx="175" cy="148" r="5" fill="#FF6B6B"/>
  <!-- Feet -->
  <rect x="70" y="190" width="16" height="20" rx="8" fill="#CC2222"/>
  <rect x="114" y="190" width="16" height="20" rx="8" fill="#CC2222"/>
</svg>

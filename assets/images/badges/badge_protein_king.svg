<svg width="96" height="112" viewBox="0 0 96 112" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Outer Rim Gradient -->
    <linearGradient id="badgeRim" x1="14" y1="10" x2="82" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <!-- Inner Background Gradient -->
    <linearGradient id="innerBg" x1="22" y1="18" x2="74" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="100%" stop-color="#FFE4E6"/>
    </linearGradient>

    <!-- Steak Meat Gradient -->
    <linearGradient id="meatGrad" x1="30" y1="30" x2="66" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>

    <!-- Gold Crown Gradient -->
    <linearGradient id="goldCrown" x1="38" y1="20" x2="58" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="20" y1="70" x2="76" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
  </defs>

  <!-- Ribbon Tail at Bottom -->
  <path d="M22 70L14 104L34 94L48 108L62 94L82 104L74 70" fill="url(#ribbonGrad)"/>
  <path d="M22 70L34 94L48 78L22 70Z" fill="#9F1239" opacity="0.35"/>
  <path d="M74 70L62 94L48 78L74 70Z" fill="#9F1239" opacity="0.35"/>

  <!-- Badge Base Circle -->
  <circle cx="48" cy="44" r="34" fill="url(#badgeRim)"/>
  <circle cx="48" cy="44" r="29" fill="#9F1239"/>
  <circle cx="48" cy="44" r="26" fill="url(#innerBg)"/>

  <!-- Golden Crown atop Emblem -->
  <path d="M37 28L40 33L48 25L56 33L59 28L57 36H39L37 28Z" fill="url(#goldCrown)"/>
  <circle cx="37" cy="27" r="1.5" fill="#FEF08A"/>
  <circle cx="48" cy="24" r="1.5" fill="#FEF08A"/>
  <circle cx="59" cy="27" r="1.5" fill="#FEF08A"/>

  <!-- T-Bone Steak Cutlet Emblem -->
  <!-- Meat Base -->
  <path d="M33 44C31 38 37 34 45 34C55 34 63 37 63 45C63 54 55 59 46 59C37 59 35 51 33 44Z" fill="url(#meatGrad)"/>
  <!-- Meat Highlight Edge -->
  <path d="M35 44C33 39 38 36 45 36C52 36 60 38 60 45C60 49 57 53 50 55" stroke="#FECDD3" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  
  <!-- T-Bone Center -->
  <path d="M42 41H54M48 41V53" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M42 41H54M48 41V53" stroke="#FFE4E6" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Marbling accents -->
  <path d="M36 48C38 50 40 49 42 52" stroke="#FDA4AF" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <path d="M53 46C56 48 58 47 59 50" stroke="#FDA4AF" stroke-width="1.2" stroke-linecap="round" fill="none"/>
</svg>
